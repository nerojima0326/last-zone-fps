name: Game regressions

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: 고정 버전 검사 환경 준비
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 전체 게임 검사
        env:
          CHECK_OUT: ${{ runner.temp }}/last-zone-checks
        run: npm run check
      - name: 대체 자원 경로 검사
        env:
          THREE_DIR: ${{ github.workspace }}/node_modules/three
        run: |
          MOTION_FALLBACK=1 node tools/check-expanded-motion.cjs
          THROW_FALLBACK=1 node tools/check-throwable-motion.cjs
          KNIFE_FALLBACK=1 node tools/check-knives.cjs
          RANGE_FALLBACK=1 node tools/check-training-range.cjs
          VEHICLE_FALLBACK=1 node tools/check-vehicle-physics.cjs
          DRIVE_MOBILE=1 node tools/check-driving-input.cjs
          CABIN_MOBILE=1 node tools/check-vehicle-cabin.cjs
          SHOTS="$RUNNER_TEMP/last-zone-checks/skid-trails.png" node tools/capture-skid-trails.cjs after
      - name: 검사 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-checks
          path: ${{ runner.temp }}/last-zone-checks
          retention-days: 7
