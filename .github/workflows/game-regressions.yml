name: Game regressions

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          npm install --prefix "$RUNNER_TEMP/lz-tests" --no-audit --no-fund playwright@1.62.1 three@0.160.0 three-mesh-bvh@0.7.8
          "$RUNNER_TEMP/lz-tests/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/lz-tests/node_modules" >> "$GITHUB_ENV"
          echo "THREE_DIR=$RUNNER_TEMP/lz-tests/node_modules/three" >> "$GITHUB_ENV"
      - name: Check ADS, distance zero and all-weapon recoil motion
        run: node tools/check-aim.cjs
      - name: Check startup ordering and delayed or missing assets
        run: node tools/check-startup.cjs
      - name: 훈련 기록·프레임 측정·봇 재조준·자세 복귀 검사
        run: node tools/check-session-polish.cjs
      - name: 차량 내구도·투척 충돌·폭발 효과 풀 검사
        run: node tools/check-vehicle-throwable-vfx.cjs
      - name: 화염 텍스처·무대기 로딩·누락 복귀 검사
        run: node tools/check-fire-flipbook.cjs
      - name: Check all weapon grips and hand animation
        run: node tools/check-hand-poses.cjs
      - name: Import bundled models
        run: |
          node tools/check-glock-import.mjs assets/models/viewmodels/glock17.fbx
          node tools/check-m4-model.mjs assets/models/viewmodels/m4_animations.zip
      - name: Exercise the shipped game and asset fallback
        run: |
          node tools/check-weapon-catalog.cjs
          node tools/check-training-range.cjs
          RANGE_FALLBACK=1 node tools/check-training-range.cjs
          node tools/check-bundled-viewmodels.cjs
          node tools/check-combat.cjs
      - name: Check reload animation and audio
        run: |
          node tools/check-original-weapon-audio.cjs
          node tools/check-reloads.cjs
          node tools/check-clearance.cjs
          node tools/check-weapon-audio.cjs
      - name: Check acoustics, hit reactions, weapon obstruction and environment detail
        run: node tools/check-combat-environment.cjs
      - name: Check native output, fixed resolution, MSAA and texture filtering
        run: |
          node tools/check-render-clarity.cjs
          node tools/check-native-reticle.cjs
