<!doctype html><html lang="ko"><meta charset="utf-8"><title>좀비 뼈대 텍스처 굽기</title><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><script type="module">
// v109 실제 클립과 바인드 행렬을 사용해 GPU용 뼈대 팔레트를 굽는다.
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
window.bake=async function(variant){
 const gltf=await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('/assets/zombies/infected-'+variant+'-lod0.glb');const scene=gltf.scene;scene.updateMatrixWorld(true);let mesh;scene.traverse(o=>{if(o.isSkinnedMesh)mesh=o});if(!mesh)throw Error('뼈대 메시가 없습니다');
 const mixer=new T.AnimationMixer(scene),fps=20,bones=mesh.skeleton.bones,frames=[],contacts=[],clips={},jointNames=['head','spine_02','upperarm_l','lowerarm_l','upperarm_r','lowerarm_r','thigh_l','calf_l','thigh_r','calf_r'];let offset=0;
 for(const clip of gltf.animations){
  mixer.stopAllAction();const action=mixer.clipAction(clip);action.setLoop(T.LoopOnce,1);action.clampWhenFinished=true;action.play();const count=Math.ceil(clip.duration*fps)+1;clips[clip.name]={offset,count,duration:clip.duration,loop:['idle','walk','run','crawl','charge'].includes(clip.name)};
  for(let f=0;f<count;f++){mixer.setTime(Math.min(clip.duration,f/fps));scene.updateMatrixWorld(true);mesh.skeleton.update();frames.push(...mesh.skeleton.boneMatrices);for(const name of jointNames){const b=bones.find(b=>b.name===name),v=new T.Vector3();b.getWorldPosition(v);contacts.push(v.x,v.y,v.z)}}offset+=count;
 }
 mixer.stopAllAction();scene.updateMatrixWorld(true);const box=new T.Box3().setFromObject(scene),height=box.max.y-box.min.y;
 const floats=new Float32Array(frames),half=new Uint16Array(floats.length);for(let i=0;i<floats.length;i++)half[i]=T.DataUtils.toHalfFloat(floats[i]);
 let data='';const bytes=new Uint8Array(half.buffer);for(let i=0;i<bytes.length;i+=16000)data+=String.fromCharCode(...bytes.subarray(i,i+16000));
 return{binary:btoa(data),metadata:{fps,bones:bones.length,frames:offset,clips,joints:jointNames,contacts,height,minY:box.min.y,bind:mesh.bindMatrix.toArray(),inverseBind:mesh.bindMatrixInverse.toArray(),meshMatrix:mesh.matrixWorld.toArray(),skeleton:bones.map(b=>b.name)}};
};
</script></html>
