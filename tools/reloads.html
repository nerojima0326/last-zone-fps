<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../">
<title>LAST ZONE · 장전 모션 스튜디오</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#e7edf4;background:#111820}
*{box-sizing:border-box}body{margin:0}canvas{display:block;width:100%;height:100%}
header{height:76px;padding:16px 26px;border-bottom:1px solid #35404c;display:flex;align-items:center;justify-content:space-between}
h1{font-size:19px;margin:0;letter-spacing:.06em}header small{color:#a1b0bf}main{display:grid;grid-template-columns:290px 1fr;height:calc(100dvh - 76px)}
aside{padding:24px;background:#171f28;overflow:auto;border-right:1px solid #35404c}label{display:block;color:#afbecb;font-size:12px;margin:0 0 8px}
select,button{font:inherit;color:inherit;background:#242f3b;border:1px solid #465362;border-radius:6px;padding:10px;width:100%;margin-bottom:18px}
button{cursor:pointer}button:hover{border-color:#dfbc76}button.primary{background:#d6b171;color:#171c22;font-weight:700;border-color:#d6b171}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}#stage{position:relative;min-width:0;background:#25313e}#stage canvas{height:calc(100% - 142px)}
#caption{position:absolute;top:24px;left:26px;pointer-events:none}#weaponName{font-size:28px;font-weight:700}#styleName{color:#c9ae7e;margin-top:7px;font-size:14px}
#timebar{position:absolute;bottom:24px;left:26px;right:26px;background:#111b26db;border:1px solid #58687a;padding:15px 18px;border-radius:8px}
input[type=range]{width:100%;accent-color:#dfbc76;margin:12px 0}#status{font-size:13px;color:#adbdcd;line-height:1.7}#clock{float:right;font-variant-numeric:tabular-nums}
.hint{font-size:12px;line-height:1.8;color:#96a7b7}a{color:#d6b171}.badge{color:#d6b171;font-size:11px;letter-spacing:.14em;margin-bottom:9px}
@media(max-width:760px){header{padding:12px 16px;height:65px}header small{display:none}main{height:calc(100dvh - 65px);grid-template-columns:220px 1fr}aside{padding:16px}#weaponName{font-size:20px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<header><h1>LAST ZONE <span style="color:#d6b171">/</span> 장전 모션 스튜디오</h1><small>15 WEAPONS · EMPTY / TACTICAL</small></header>
<main>
<aside>
<label for="weapon">총기</label><select id="weapon" disabled></select>
<label for="mode">장전 상태</label><select id="mode"><option value="empty">빈 탄창</option><option value="tactical">잔탄 있음</option></select>
<label for="speed">재생 속도</label><select id="speed"><option value="1">1× 정상</option><option value="0.5">0.5× 슬로모션</option><option value="0.25">0.25× 자세 확인</option></select>
<label for="view">카메라</label><select id="view"><option value="fp">1인칭</option><option value="arms">팔 전체</option><option value="side">왼쪽 측면</option><option value="front">앞쪽 사선</option><option value="rightSide">오른쪽 측면</option><option value="top">위에서 보기</option><option value="leftHand">왼손 확대</option><option value="rightHand">오른손 확대</option></select>
<button id="restart" class="primary" disabled>처음부터 장전</button>
<div class="row"><button id="play" disabled>일시정지</button><button id="sound">소리 켜기</button></div>
<div id="status" role="status">총기 모델을 준비하는 중…</div>
<p class="hint">타임라인을 움직이면 원하는 순간에서 멈춰 볼 수 있습니다. 사격·이동 없이 게임과 같은 손·부품·재장전 로직만 실행합니다.</p>
<p class="hint">모델이 없으면 절차적 모델을 사용합니다.<br><a href="index.html">게임으로 돌아가기</a></p>
</aside>
<section id="stage" aria-label="장전 애니메이션 미리보기">
<div id="caption"><div class="badge">RELOAD STUDY / BUILD 19</div><div id="weaponName">LOADING</div><div id="styleName"></div></div>
<div id="timebar"><label for="timeline">장전 진행 <span id="clock">0.00 / 0.00 s</span></label><input id="timeline" type="range" min="0" max="1" step="0.001" value="0" disabled><div class="hint" id="ammo">실제 탄 수와 재장전 단계를 표시합니다.</div></div>
</section>
</main>
<script type="module">
import * as T from 'three';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
window.THREE = {...T, mergeGeometries, GLTFLoader, FBXLoader, MeshoptDecoder};
window.LZ_BUILD = '19';
const $ = id => document.getElementById(id);
try {
  for (const file of ['core','gunlib','gunmodels','weapons','player']) await new Promise((resolve,reject) => {
    const s=document.createElement('script'); s.src=`js/${file}.js?v=19`; s.onload=resolve; s.onerror=()=>reject(new Error(file+' 로드 실패')); document.body.appendChild(s);
  });
  const G=window.G, stage=$('stage'), renderer=new T.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=1;
  stage.prepend(renderer.domElement);
  const scene=new T.Scene(), camera=new T.PerspectiveCamera(54,1,0.01,10);
  scene.background=new T.Color(0x344352);
  const room=new RoomEnvironment(), pmrem=new T.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(room,0.04).texture;room.dispose();pmrem.dispose();
  G.vmCamera=camera;
  if (new URLSearchParams(location.search).get('models')!=='procedural') await G.GunModels.load(renderer);
  G.VM.init(scene);
  const P=G.Player, VM=G.VM, click=G.Audio.click.bind(G.Audio);
  let id='ar7', elapsed=0, duration=1, playing=true, wait=0, sound=false, seeking=false;
  G.Audio.click=kind=>{if(sound&&!seeking)click(kind)};
  P.ejectShell=()=>{}; // 독립 미리보기에는 월드가 없어 화면 밖으로 나가는 탄피는 생략한다.
  const state={ads:0,sprint:false,crouch:false,lookDX:0,lookDY:0,moving:0,phase:0,landDip:0,raise:1,pumpP:-1,cycleP:-1,scope:null,hideVM:false,throwP:-1,punchP:-1};
  for(const key of G.GUN_IDS){const o=document.createElement('option');o.value=key;o.textContent=G.WEAPONS[key].name;$('weapon').appendChild(o)}
  function reset(){
    const d=G.WEAPONS[id], mag=$('mode').value==='empty'?0:Math.max(1,Math.floor(d.mag/2));
    P.init({cur:d.cls,weapons:{[d.cls]:{id,mag}},ammo:{[d.ammo]:100}});
    VM.set(id); VM.t=0; VM.kick=VM.kickV=0; VM.prevP=-1;VM.rlKey='';VM.camE=0;
    for(const v of Object.values(VM.spr))v[0]=v[1]=0;
    const m=VM.models[id];m.armL.cur.copy(m.fore);m.armR.cur.copy(m.grip);m.snap=true;
    P.startReload();elapsed=0;wait=0;pose();VM.update(1/240,state);
  }
  function pose(){
    const R=P.reload, inst=P.a.weapons[P.a.cur], d=G.WEAPONS[id];
    state.empty=inst.mag===0;state.reload=null;
    if(R){const r=state.reload={type:R.kind,empty:R.empty,port:!!R.port,per:R.per||1};
      if(R.kind==='mag'||R.kind==='revolver')r.p=R.t/R.dur;
      else{r.phase=R.phase;r.pp=R.phase==='load'?0:G.U.clamp(R.t/P.phaseDur(R,d),0,1);r.shellP=R.phase==='load'?R.shellT/(R.cyc||d.reload):-1}
    }
  }
  function step(dt){if(P.reload)P.reloadLogic(dt);pose();VM.update(dt,state)}
  function configure(){
    id=$('weapon').value||'ar7';reset();
    seeking=true;let n=0;while(P.reload&&n++<6000)P.reloadLogic(1/240);duration=n/240;
    reset();seeking=false;playing=true;$('play').textContent='일시정지';
    $('weaponName').textContent=G.WEAPONS[id].name;$('styleName').textContent=G.Guns.reloadFeel(id).name;
    const m=VM.models[id];$('status').textContent=`${m.real?'에셋 모델':'절차적 모델'} · ${$('mode').selectedOptions[0].textContent} · 장전 ${duration.toFixed(2)}초`;
  }
  function seek(t){
    seeking=true;reset();const ticks=Math.floor((t+1e-9)*240);
    for(let i=0;i<ticks;i++)step(1/240);
    const tail=t-ticks/240;if(tail>1e-9)step(tail);
    elapsed=t;seeking=false;draw();
  }
  function draw(){
    const w=stage.clientWidth,h=Math.max(160,stage.clientHeight-142);
    if(renderer.domElement.width!==Math.round(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(h*renderer.getPixelRatio()))renderer.setSize(w,h,false);
    camera.aspect=w/h;
    if($('view').value==='side'){camera.fov=48;camera.position.set(-1.4,0.05,-0.12);camera.lookAt(0,-0.16,-0.42)}
    else if($('view').value==='rightSide'){camera.fov=48;camera.position.set(1.15,0.06,-0.1);camera.lookAt(0,-0.05,-0.35)}
    else if($('view').value==='top'){camera.fov=48;camera.position.set(0,1.2,-0.15);camera.lookAt(0,-0.05,-0.35)}
    else if($('view').value==='front'){camera.fov=48;camera.position.set(-0.8,0.25,-1.35);camera.lookAt(0,-0.15,-0.35)}
    else if($('view').value==='arms'){
      const m=VM.models[id];m.root.updateMatrixWorld(true);
      const focus=m.armL.S.clone().add(m.armL.bW.position).multiplyScalar(0.5);m.root.localToWorld(focus);
      camera.fov=48;camera.position.copy(focus).add(new T.Vector3(-0.95,0.23,0.7));camera.lookAt(focus);
    }else if($('view').value.endsWith('Hand')){
      const m=VM.models[id],arm=$('view').value==='leftHand'?m.armL:m.armR;
      m.root.updateMatrixWorld(true);const focus=arm.bW.localToWorld(new T.Vector3(0,0.055,0));
      const normal=new T.Vector3(0,0,-1).transformDirection(arm.bW.matrixWorld);
      camera.fov=40;camera.position.copy(focus).addScaledVector(normal,0.42).add(new T.Vector3(0,0.035,0.05));camera.lookAt(focus);
    }else{camera.fov=54;camera.position.set(0,0,0);camera.rotation.set(VM.camRX,VM.camRY,VM.camRZ)}
    camera.updateProjectionMatrix();renderer.render(scene,camera);
    $('timeline').value=Math.min(1,elapsed/duration);$('clock').textContent=`${Math.min(elapsed,duration).toFixed(2)} / ${duration.toFixed(2)} s`;
    const inst=P.a.weapons[P.a.cur],d=G.WEAPONS[id];$('ammo').textContent=`탄창 ${inst.mag} / ${d.mag} · ${P.reload?(P.reload.phase||'탄창 교환'):'장전 완료'}`;
  }
  for(const name of ['weapon','mode'])$(name).onchange=configure;
  $('restart').onclick=configure;
  $('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'일시정지':'재생'};
  $('timeline').oninput=()=>{playing=false;$('play').textContent='재생';seek(Number($('timeline').value)*duration)};
  $('sound').onclick=()=>{G.Audio.init();if(G.Audio.ctx)G.Audio.ctx.resume();sound=!sound;$('sound').textContent=sound?'소리 끄기':'소리 켜기'};
  for(const name of ['weapon','restart','play','timeline'])$(name).disabled=false;
  configure();
  let previous=performance.now();
  function frame(now){const dt=Math.min(0.05,(now-previous)/1000)*Number($('speed').value);previous=now;
    if(playing){if(elapsed<duration){step(dt);elapsed+=dt}else{step(dt);wait+=dt;if(wait>0.9)reset()}}draw();requestAnimationFrame(frame)}
  // 자동 확인도 이 미리보기에서 실제 게임 모션을 실행한다.
  window.ReloadStudio={get ready(){return true},select(key,mode='empty'){ $('weapon').value=key;$('mode').value=mode;configure()},seek,
    advance(dt){step(dt);elapsed+=dt},
    pause(){playing=false},get duration(){return duration},get model(){return VM.models[id]},get state(){return P.reload},renderer,scene,camera};
  requestAnimationFrame(frame);
}catch(e){$('status').textContent='미리보기 오류: '+e.message;console.error(e)}
</script>
</body></html>
