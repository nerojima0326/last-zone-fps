<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모델 뷰어 (개발용)</title>
<style>html,body{margin:0;height:100%;background:#556;overflow:hidden;font:12px sans-serif;color:#fff}#log{position:fixed;left:6px;top:6px;white-space:pre;background:#0008;padding:4px;max-height:96vh;overflow:auto}</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="log"></div>
<script type="module">
// 개발용 모델 뷰어: tools/viewer.html?m=rifle | pistol | char:Military_Male_03  (나머지 총은 tools/guns/build.html)
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
const q = new URLSearchParams(location.search), m = q.get('m') || 'rifle';
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.8;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x667080);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
scene.add(new THREE.HemisphereLight(0xddeeff, 0x554433, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.5); sun.position.set(2, 3, 2); scene.add(sun);
new RGBELoader().load('../assets/hdri/kloofendal_48d_partly_cloudy_puresky_1k.hdr', t => { t.mapping = THREE.EquirectangularReflectionMapping; scene.environment = t; });
const blank = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
const mgr = new THREE.LoadingManager(); mgr.setURLModifier(u => /\.(tga|png|jpg|psd)$/i.test(u) && !/assets\/(char|models)\/.*(diff|nor|arm)/.test(u) ? blank : u);
const info = window.info = { meshes: [], bones: [] };
function describe(root) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root); info.box = [box.min.toArray(), box.max.toArray()].map(a => a.map(v => +v.toFixed(3)));
  root.traverse(o => {
    if (o.isMesh) {
      const g = o.geometry, mats = Array.isArray(o.material) ? o.material : [o.material];
      info.meshes.push({ name: o.name, skinned: !!o.isSkinnedMesh, verts: g.attributes.position.count, tris: (g.index ? g.index.count : g.attributes.position.count) / 3, groups: g.groups.length, mats: mats.map(x => x.name), attrs: Object.keys(g.attributes) });
    }
    if (o.isBone) { const p = o.getWorldPosition(new THREE.Vector3()); info.bones.push(o.name + ' ' + (o.parent ? o.parent.name : '') + ' [' + p.toArray().map(v => v.toFixed(2)) + ']'); }
  });
}
function frame(root) {
  const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()).length();
  const az = +(q.get('az') || 0.6), el = +(q.get('el') || 0.25), d = s * (+(q.get('z') || 1.4));
  cam.position.set(c.x + Math.sin(az) * d, c.y + el * d, c.z + Math.cos(az) * d); cam.lookAt(c); cam.near = d / 100; cam.far = d * 10; cam.updateProjectionMatrix();
}
const tl = new THREE.TextureLoader();
const tex = (u, srgb) => { const t = tl.load(u); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.flipY = q.get('flip') !== '0'; return t; };
let root;
if (m === 'rifle') {
  root = await new FBXLoader(mgr).loadAsync('../assets/models/rifle/M4A1.fbx');
  const arm = tex('../assets/models/rifle/m4a1_arm.jpg');
  const mat = new THREE.MeshStandardMaterial({ map: tex('../assets/models/rifle/m4a1_diff.jpg', true), normalMap: tex('../assets/models/rifle/m4a1_nor.jpg'), roughnessMap: arm, metalnessMap: arm, roughness: 1, metalness: 1 });
  root.traverse(o => { if (o.isMesh) { info.origMats = (Array.isArray(o.material) ? o.material : [o.material]).map(x => x.name); o.material = mat; } });
} else if (m === 'pistol') {
  root = (await new GLTFLoader().loadAsync('../assets/models/pistol/service_pistol_1k.gltf')).scene;
} else if (m.startsWith('char:')) {
  const n = m.slice(5), base = '../assets/char/' + n + '/';
  root = await new FBXLoader(mgr).loadAsync(base + n + '.fbx');
  const mk = {};
  const pick = name => { const k = ['equipment', 'helmet', 'head', 'body'].find(p => name.toLowerCase().includes(p)) || 'body'; return mk[k] || (mk[k] = new THREE.MeshStandardMaterial({ name: k, map: tex(base + k + '_diff.jpg', true), normalMap: tex(base + k + '_nor.jpg'), roughness: 0.8 })); };
  root.traverse(o => { if (o.isMesh) { const ms = Array.isArray(o.material) ? o.material : [o.material]; info.origMats = (info.origMats || []).concat(ms.map(x => x.name)); o.material = Array.isArray(o.material) ? ms.map(x => pick(x.name)) : pick(o.material.name); } });
  info.anims = root.animations.map(a => a.name + ':' + a.duration.toFixed(2));
}
scene.add(root);
describe(root);
frame(root);
document.getElementById('log').textContent = JSON.stringify(Object.assign({}, info, { bones: info.bones.length + ' bones' }), null, 1);
function loop() { requestAnimationFrame(loop); r.render(scene, cam); }
loop();
</script>
</body>
</html>
